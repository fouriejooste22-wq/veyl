; Operation Shadowline - scalability ladder
;
; Levels 0..3 map onto the Low / Medium / High / Ultra presets in the settings menu.
; UShadowlineGameUserSettings::ApplyQualityPreset sets every group to one level; changing a
; single group afterwards puts the menu into its Custom state.
;
; The guiding decision: Low must not require Lumen. On level 0 global illumination falls
; back to screen-space, which is what makes the game viable on hardware without a
; Shader Model 6 path. Everything above level 0 assumes Lumen.
;
; These are informed starting values, not measured ones. Re-tune them against frame
; captures on real target hardware before shipping.

[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=2
r.ViewDistanceScale=0.4
foliage.LODDistanceScale=0.4
grass.DensityScale=0.3

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.7
foliage.LODDistanceScale=0.7
grass.DensityScale=0.6

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
foliage.LODDistanceScale=1.0
grass.DensityScale=1.0

[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.5
foliage.LODDistanceScale=1.5
grass.DensityScale=1.4

[ShadowQuality@0]
