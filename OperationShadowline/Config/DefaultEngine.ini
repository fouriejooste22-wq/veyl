; Operation Shadowline - engine configuration
; Every value here is a starting point chosen for a fully dynamic, Lumen-lit open world.
; Anything marked VERIFY needs a pass on real target hardware before it is treated as final.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Shadowline/Maps/L_MainMenu.L_MainMenu
EditorStartupMap=/Game/Shadowline/Maps/L_Aurelia_Sandbox.L_Aurelia_Sandbox
GlobalDefaultGameMode=/Script/OperationShadowline.ShadowlineGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
GameUserSettingsClassName=/Script/OperationShadowline.ShadowlineGameUserSettings

[/Script/Engine.RendererSettings]
; --- Global illumination and reflections: Lumen ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenTracingTraceMeshSDFs=1
r.LumenScene.Radiosity=1
; Software ray tracing needs mesh distance fields. Non-negotiable for Lumen without RT hardware.
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.2
; Hardware ray tracing stays off by default so the project boots on non-RT GPUs.
; The settings menu can enable it where UShadowlineGameUserSettings::IsHardwareRayTracingCapable is true.
r.RayTracing=False
r.Lumen.HardwareRayTracing=0

; --- Shadows ---
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.5
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

; --- Geometry ---
r.Nanite=1
r.Nanite.ProjectEnabled=True
r.Nanite.MaxPixelsPerEdge=1.0
; Static lighting is off: the day/night cycle means nothing can be baked.
r.AllowStaticLighting=False

; --- Anti-aliasing and upscaling ---
; 4 = Temporal Super Resolution. The clearest option for dense foliage in motion.
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200
r.DefaultFeature.AntiAliasing=4

; --- Textures and streaming ---
r.VirtualTextures=True
r.VirtualTexturedLightmaps=False
r.Streaming.PoolSize=2000
r.Streaming.LimitPoolSizeToVRAM=1
r.MipMapLODBias=0

; --- Post processing defaults ---
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.Bias=1.0
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.DefaultFeature.MotionBlur=True
r.MotionBlurQuality=4
r.MotionBlur.Amount=0.35
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=False
r.Tonemapper.Sharpen=0.4

; --- Volumetrics: fog, clouds, light shafts ---
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.VolumetricFog.HistoryMissSupersampleCount=4
r.VolumetricCloud=1
r.VolumetricRenderTarget=1
r.VolumetricRenderTarget.Mode=0

; --- Skinned geometry (needed for high-quality characters and for RT support later) ---
r.SkinCache.CompileShaders=True
r.SkinCache.DefaultBehavior=1

; --- Occlusion and GPU-driven rendering ---
r.GPUScene.MaxPooledUploadBufferSize=0
r.AllowOcclusionQueries=True

; --- Forward/deferred ---
r.ForwardShading=False
r.VertexFoliage.Enable=True

[/Script/Engine.PhysicsSettings]
PhysicsPrediction=False
DefaultGravityZ=-980.000000
DefaultTerminalVelocity=4000.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=4
bEnableEnhancedDeterminism=False

[/Script/NavigationSystem.NavigationSystemV1]
bAllowClientSideNavigation=True
; Dynamic modifiers only: the island is far too large to rebuild navigation wholesale.
bInitialBuildingLocked=False
bAutoCreateNavigationData=True

[/Script/Engine.CollisionProfile]
; Traversal probes use ECC_Visibility, so no custom trace channel is required yet.
; Stage 7 will add a "StealthVision" channel for NPC line of sight.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioSampleRate=48000

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.UserInterfaceSettings]
bAllowHighDPIInGameMode=True
ApplicationScale=1.000000

[/Script/Engine.AudioSettings]
DefaultSoundClassName=/Engine/EngineSounds/Master.Master
VoiceCount=48
